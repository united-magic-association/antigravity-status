[package]
name = "antigravity-status"
version = "0.1.0"
edition = "2024"
description = "Configurable status line renderer for Google Antigravity CLI (agy)"
license = "MIT"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
