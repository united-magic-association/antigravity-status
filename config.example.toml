# Configuration for antigravity-status
# Default search order:
#   1. --config <path>
#   2. $AGY_STATUS_CONFIG
#   3. <cwd>/.antigravity-status.toml
#   4. ~/.config/antigravity-status/config.toml

[general]
separator = " │ "
# Alignment: "right" (pads using `terminal_width` from agy) or "left"
align = "right"
right_margin = 0
# Controls rendered order. Remove or disable items individually under [modules.*].
order = [
  "mode",
  "context_gauge",
  "session_input_tokens",
  "session_cache_read_tokens",
  "session_cache_write_tokens",
  "session_output_tokens",
  "session_cost",
  "model_and_effort",
  "quota_5h_gauge",
  "quota_weekly_gauge",
]
# Optional multi-line layout. If non-empty, overrides `general.order`.
# lines = [
#   ["mode", "context_gauge", "session_cost", "model_and_effort"],
#   ["session_input_tokens", "session_cache_read_tokens", "session_cache_write_tokens", "session_output_tokens", "quota_5h_gauge", "quota_weekly_gauge"],
# ]
hide_zero_cache_write = false
hide_missing_cost = false

[format]
compact_tokens = true
cost_precision = 4
color = true

[storage]
enabled = true
# Optional SQLite path (defaults to $XDG_DATA_HOME/antigravity-status/history.db or ~/.local/share/antigravity-status/history.db)
# db_path = "~/.local/share/antigravity-status/history.db"

[modules.context_gauge]
enabled = true
label = "Ctx"
width = 10
warn_percent = 70.0
critical_percent = 90.0
filled_char = "█"
empty_char = "░"

[modules.session_input_tokens]
enabled = true
label = "In"

[modules.session_cache_read_tokens]
enabled = true
label = "CacheR"

[modules.session_cache_write_tokens]
enabled = false
label = "CacheW"

[modules.session_output_tokens]
enabled = true
label = "Out"

[modules.session_cost]
enabled = true
label = "Cost"
show_subagent = false
# Estimate USD cost locally from token counts when `agy` omits `cost` (e.g. Google AI Ultra).
estimate_when_missing = true
estimated_prefix = "~"

[modules.model_and_effort]
enabled = true
label = ""
# Show effort inline as "Gemini 4 Hydrogen (High)". Set false to hide "(High)".
include_effort = true

[modules.mode]
enabled = true
label = "Mode:"

[modules.quota_5h_gauge]
enabled = true
label = "5h"
width = 6
decimals = 1
warn_percent = 30.0
critical_percent = 10.0
filled_char = "█"
empty_char = "░"
hide_missing = true

[modules.quota_weekly_gauge]
enabled = true
label = "Wk"
width = 6
decimals = 1
warn_percent = 30.0
critical_percent = 10.0
filled_char = "█"
empty_char = "░"
hide_missing = true

# Fallback per-1M token pricing in USD (used only when `agy` omits `cost`).
[pricing.default]
input_per_million = 2.00
cache_read_per_million = 0.20
cache_write_per_million = 2.50
output_per_million = 12.00

# Optional per-model substring overrides (longest match wins):
# [pricing.models."flash"]
# input_per_million = 0.30
# cache_read_per_million = 0.03
# cache_write_per_million = 0.375
# output_per_million = 2.50
